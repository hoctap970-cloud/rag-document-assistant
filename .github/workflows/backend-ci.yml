name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Set up Node for React
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test and build React
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify the committed frontend matches its source
        working-directory: .
        run: |
          git diff --exit-code -- backend/src/main/resources/static
          test -z "$(git ls-files --others --exclude-standard backend/src/main/resources/static)"

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Package application
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
