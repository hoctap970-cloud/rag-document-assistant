spring.application.name=rag-document-assistant
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# The key is read from the operating system and is never stored in source code.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
app.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.gemini.embedding-dimensions=768
app.gemini.max-output-tokens=8192
app.gemini.timeout-seconds=120

app.rag.chunk-size=1500
app.rag.chunk-overlap=220
app.rag.max-chunks-per-document=800
app.rag.max-results=14
app.rag.min-score=0.35
app.rag.candidate-count=40
app.rag.max-context-characters=48000
app.rag.full-context-characters=24000
app.rag.neighbor-window=1
app.rag.rerank-enabled=${RAG_RERANK_ENABLED:true}

# Vision reads sparse PDF pages, large PDF images and PNG/JPEG in DOCX.
# These requests use the same Gemini account as chat/embedding.
app.parsing.vision-enabled=${RAG_VISION_ENABLED:true}
app.parsing.max-pdf-pages=250
app.parsing.max-vision-pages=40
