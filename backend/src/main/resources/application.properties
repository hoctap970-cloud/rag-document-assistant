spring.application.name=rag-document-assistant
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# The key is read from the operating system and is never stored in source code.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.chat-model=gemini-2.5-flash
app.gemini.embedding-model=gemini-embedding-001
app.gemini.embedding-dimensions=768

app.rag.chunk-size=900
app.rag.chunk-overlap=120
app.rag.max-chunks-per-document=800
app.rag.max-results=5
app.rag.min-score=0.55
